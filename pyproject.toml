[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "socklight"
version = "0.1.0"
description = "sax's optical model library on numpy, exposed to VACASK as OSDI devices"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy"]

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = ["src/socklight"]
# `pip install -e .` builds socklight.osdi into src/socklight/ (see CMakeLists.txt).
editable.mode = "inplace"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.cibuildwheel]
# Only the tests are copied, not pyproject.toml: its pytest `pythonpath = ["src"]`
# would import the source tree instead of the installed wheel.
test-sources = ["tests"]
test-requires = ["pytest"]
test-command = "python -m pytest -m 'not native' -q tests"

[tool.cibuildwheel.pyodide]
# WebAssembly (Pyodide/Emscripten), as VACASK's Pyodide wheel: socklight.osdi is a
# side module and va/*.va are compiled to side modules by an openvaf-r with the
# wasm32-unknown-emscripten target (OPENVAF_COMPILER). The host strip would remove
# the dylink.0 section a side module needs. The tests simulate with VACASK's own
# Pyodide wheel, which is not on PyPI: ci/build-pyodide.sh adds it to the test
# requirements (CIBW_TEST_REQUIRES_PYODIDE) from VACASK_PYODIDE_WHEEL.
environment = { CMAKE_ARGS = "-DOPENVAF_COMPILER=$OPENVAF_COMPILER", SKBUILD_INSTALL_STRIP = "false" }
