name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# VACASK and openvaf-r (with the wasm32-unknown-emscripten target) come from
# PyPI: vacask is a dependency, vacask-bin a build requirement (pyproject.toml).
# cibuildwheel builds each wheel and runs the tests against the installed wheel,
# natively and in Pyodide.
jobs:
  wheels-linux:
    name: Wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v4.3.5
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  wheels-pyodide:
    # Pyodide 314 (Python 3.14, Emscripten 5.0.3), the Pyodide marimo ships.
    name: Wheels (Pyodide)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: cp314-pyodide_wasm32
      # PyPI accepts the PEP 783 tag only: fail here rather than mid-release.
      - name: Check the platform tag
        run: |
          ls wheelhouse
          ls wheelhouse/*-cp314-cp314-pyemscripten_2026_0_wasm32.whl
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-pyodide
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  # Publishes on a v* tag. pypi.org must list this repository, this workflow
  # file (ci.yml) and the environment "pypi" as a trusted publisher of socklight.
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels-linux, wheels-pyodide, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/socklight
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
